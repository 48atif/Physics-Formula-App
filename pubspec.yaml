name: physix_lab

description: Interactive Physics Laboratory for Class 9-10 physics learning.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

  assets:
    - assets/icon.png


flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icon.png"

  adaptive_icon_background: "#063D2E"
  adaptive_icon_foreground: "assets/icon.png"

  remove_alpha_ios: true